<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Mumu</title>
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("mumu-theme");
          if (saved === "dark" || saved === "light") theme = saved;
          else if (matchMedia("(prefers-color-scheme: dark)").matches)
            theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;

        var lang = "en";
        try {
          var savedLang = localStorage.getItem("mumu-lang");
          if (savedLang === "th" || savedLang === "en") lang = savedLang;
          else if (
            navigator.language &&
            navigator.language.toLowerCase().startsWith("th")
          )
            lang = "th";
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dataset.lang = lang;
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/snake-face.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-wrap">
      <header class="game-header">
        <h1 class="title">
          <img src="assets/snake-face.png" alt="" class="title-face" />
          Mumu
        </h1>
        <div class="header-tools">
          <div class="scores">
            <div class="score-card">
              <span class="score-label" data-i18n="scoreNow">now</span>
              <span class="score-value" id="score">0</span>
            </div>
            <div class="score-card">
              <span class="score-label" data-i18n="scoreBest">best</span>
              <span class="score-value" id="high-score">0</span>
            </div>
            <div class="score-card score-card-coins">
              <span class="score-label" data-i18n="scoreCoins">coins</span>
              <span class="score-value" id="coin-balance">0</span>
            </div>
          </div>
          <button
            id="lang-btn"
            class="lang-btn"
            type="button"
            aria-label="Switch to Thai"
          >
            ไทย
          </button>
          <button
            id="theme-btn"
            class="theme-btn"
            type="button"
            aria-pressed="false"
            aria-label="Switch to dark mode"
          >
            <svg
              class="theme-icon icon-moon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M15.4 3.6a8.2 8.2 0 1 0 5 14.4 7.1 7.1 0 0 1-9.6-9.4 8 8 0 0 0 4.6-5Z"
              />
            </svg>
            <svg
              class="theme-icon icon-sun"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4.1" />
              <path
                d="M12 2.8v2.3M12 18.9v2.3M2.8 12h2.3M18.9 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M5.2 18.8l1.6-1.6M17.2 6.8l1.6-1.6"
              />
            </svg>
          </button>
        </div>
      </header>

      <div class="board-wrap">
        <canvas id="board" width="480" height="480"></canvas>

        <div class="overlay visible" id="overlay">
          <div class="overlay-content" id="overlay-content">
            <img src="assets/snake-face.png" alt="" class="overlay-face" />
            <h2 id="overlay-title">Hungry?</h2>
            <p id="overlay-text">
              Arrows, WASD, or a swipe. Don't bite yourself.
            </p>
            <button id="play-btn" class="play-btn">Go</button>
          </div>
        </div>
      </div>

      <div class="dpad" id="dpad" aria-label="Direction controls">
        <button class="dpad-btn dpad-up" data-dir="up" aria-label="Move up">
          <svg class="dpad-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6 20 18H4Z" />
          </svg>
        </button>
        <button
          class="dpad-btn dpad-left"
          data-dir="left"
          aria-label="Move left"
        >
          <svg class="dpad-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6 20 18H4Z" />
          </svg>
        </button>
        <button class="dpad-btn dpad-pause" id="pause-btn" aria-label="Pause">
          <svg
            class="dpad-icon icon-pause"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="6" y="5" width="4.5" height="14" rx="1.2" />
            <rect x="13.5" y="5" width="4.5" height="14" rx="1.2" />
          </svg>
          <svg
            class="dpad-icon icon-play"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8.2 5.6v12.8L19.2 12 8.2 5.6Z" />
          </svg>
        </button>
        <button
          class="dpad-btn dpad-right"
          data-dir="right"
          aria-label="Move right"
        >
          <svg class="dpad-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6 20 18H4Z" />
          </svg>
        </button>
        <button
          class="dpad-btn dpad-down"
          data-dir="down"
          aria-label="Move down"
        >
          <svg class="dpad-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6 20 18H4Z" />
          </svg>
        </button>
      </div>

      <div
        class="boost-badges"
        id="boost-badges"
        hidden
        aria-label="Boosts for next run"
      ></div>

      <div class="action-row">
        <button
          id="auto-play-btn"
          class="auto-play-btn"
          type="button"
          aria-pressed="false"
        >
          Auto
        </button>
        <button id="shop-btn" class="shop-btn" type="button" data-i18n="shop">
          Shop
        </button>
        <button
          id="shrink-btn"
          class="shrink-btn"
          type="button"
          hidden
          aria-label="Use shrink potion"
        >
          Shrink
        </button>
      </div>

      <p class="hint" data-i18n="hint">
        arrows / wasd to slither &middot; space to pause
      </p>

      <button
        id="source-btn"
        class="source-btn"
        type="button"
        aria-haspopup="dialog"
        data-i18n="source"
      >
        &lt;/&gt; source
      </button>
    </main>

    <div class="shop-modal" id="shop-modal" hidden>
      <div class="source-backdrop" id="shop-backdrop"></div>
      <div
        class="source-panel shop-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="shop-title"
      >
        <header class="source-header">
          <h2 id="shop-title" class="source-title" data-i18n="shop">Shop</h2>
          <div class="source-actions">
            <span class="shop-balance"
              ><span id="shop-coin-balance">0</span>
              <span data-i18n="coinsWord">coins</span></span
            >
            <button
              id="shop-close-btn"
              class="source-action-btn source-close-btn"
              type="button"
              aria-label="Close"
            >
              &times;
            </button>
          </div>
        </header>
        <div class="shop-body" id="shop-items"></div>
      </div>
    </div>

    <div class="source-modal" id="source-modal" hidden>
      <div class="source-backdrop" id="source-backdrop"></div>
      <div
        class="source-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="source-title"
      >
        <header class="source-header">
          <h2 id="source-title" class="source-title" data-i18n="sourceTitle">
            Source
          </h2>
          <div class="source-actions">
            <button
              id="source-copy-btn"
              class="source-action-btn"
              type="button"
              data-i18n="copy"
            >
              Copy
            </button>
            <button
              id="source-close-btn"
              class="source-action-btn source-close-btn"
              type="button"
              aria-label="Close"
            >
              &times;
            </button>
          </div>
        </header>

        <div class="source-tabs" role="tablist" aria-label="Source files">
          <button
            class="source-tab is-active"
            type="button"
            role="tab"
            aria-selected="true"
            data-file="game.js"
          >
            game.js
          </button>
          <button
            class="source-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-file="style.css"
          >
            style.css
          </button>
          <button
            class="source-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-file="index.html"
          >
            index.html
          </button>
        </div>

        <div class="source-body">
          <pre
            class="source-code"
            id="source-code"
            tabindex="0"
          ><code></code></pre>
          <p class="source-error" id="source-error" hidden></p>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
    <script src="source-viewer.js"></script>
  </body>
</html>
